services:
  backend:
    image: sachinthapak/learnncicdbackend-image:latest
    container_name: sachinthapak_learncicdbackend-container
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    image: sachinthapak/learncicdfrontend-image:latest
    container_name: sachinthapak_learncicdfrontend-container
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      - backend
