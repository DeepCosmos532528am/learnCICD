services:
  backend:
    image: sachinthapak/learnncicdbackend-image:latest
    container_name: sachinthapak/learnncicdbackend-container
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    image: sachinthapak/learncicdfrontend-image:latest
    container_name: sachinthapak/learncicdfrontend-container
    ports:
      - "5173:5173"
    restart: unless-stopped
    depends_on:
      - backend
